<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리셋재활의학과의원 카카오맵</title>
  <style>
    body { margin: 0; background: #ebe9e4; font-family: sans-serif; }
    #daumRoughmapContainer1794802767130 { width: 100%; padding: 0; border: 0; }
    .map-fallback { display: none; }
    #daumRoughmapContainer1794802767130:empty + .map-fallback {
      display: grid; place-items: center; min-height: 300px; color: #087c70;
    }
  </style>
</head>
<body>
  <div id="daumRoughmapContainer1794802767130" class="root_daum_roughmap root_daum_roughmap_landing"></div>
  <a class="map-fallback" href="https://map.kakao.com/link/to/1181072255" target="_blank" rel="noreferrer">카카오맵에서 위치 확인 ↗</a>
  <!-- The official loader uses document.write and needs a parser-inserted script. -->
  <script class="daum_roughmap_loader_script" src="https://t1.kakaocdn.net/kakaomapweb/roughmap/loader/prod/roughmapLoader.js"></script>
  <script>
    if (window.daum?.roughmap?.Lander) {
      const map = new daum.roughmap.Lander({
        timestamp: "1794802767130",
        key: "54rv29dnudf",
        mapHeight: "300"
      });
      map.render();
      window.addEventListener("resize", () => {
        // The widget's map canvas needs a layout pass when the frame changes width.
        if (!map.jsMap?.relayout) return;
        const center = map.jsMap.getCenter();
        map.jsMap.relayout();
        map.jsMap.setCenter(center);
      });
    }
  </script>
</body>
</html>
