name: Apply Danaun rebrand
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify and apply reviewed snapshot
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, subprocess, zipfile
          root = pathlib.Path.cwd().resolve()
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == 'e2a60c938f4f3aadbb33235def5f9ed586919c34', 'Branch changed; review before replacing'
          archive = root / 'danaun-rebrand.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '9352e6e73a16cfa5522ba4a271ffcf25aae02beda16f2a10b7f8bb96438ad6bc'
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == 128 and 'app/page.js' in names and 'public/images/danaun-doctor.png' in names
              assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
              tracked = subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0))
              for name in filter(None, tracked):
                  path = (root / name).resolve()
                  assert path.is_relative_to(root)
                  if path != archive and path.is_file(): path.unlink()
              z.extractall(root)
          archive.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "feat: rebuild Danaun clinic with original branding, content and male physician imagery"
          git push origin HEAD:main
